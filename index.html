<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="meta-title">Aivizex — AI & Tech, Finance, Insurance, Health & Remote Work</title>
  <meta id="meta-desc" name="description" content="Trusted US editorial insights, analysis, and guides on AI & Tech, Personal Finance, Insurance, Health, and Remote Work." />
  <link rel="preconnect" href="https://googleapis.com">

  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://jsdelivr.net"></script>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --accent-soft: #eff6ff;
      --border: #e2e8f0;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
      --shadow-hover: 0 12px 28px -4px rgba(15, 23, 42, 0.12);
    }

    body.dark {
      --bg: #090d16;
      --surface: #111827;
      --card-bg: #151e2e;
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --border: #1e293b;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 12px 28px -4px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
    .hidden { display: none !important; }

    /* Top Bar / Header */
    .top-strip {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      padding: 6px 0;
    }
    .top-strip-inner { display: flex; justify-content: space-between; align-items: center; }

    .navbar {
      position: sticky;
      top: 0;
      background: rgba(var(--bg), 0.92);
      backdrop-filter: blur(12px);
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      padding: 14px 0;
    }
    .nav-content { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .logo {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .logo-dot { color: var(--primary); }

    .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
    .cat-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 7px 14px;
      border-radius: 999px;
      transition: all 0.2s;
    }
    .cat-btn:hover { color: var(--primary); background: var(--accent-soft); }
    .cat-btn.active { background: var(--primary); color: #ffffff; }

    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .search-box { position: relative; }
    #search-input {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      width: 190px;
      transition: width 0.2s, border-color 0.2s;
    }
    #search-input:focus { outline: none; border-color: var(--primary); width: 230px; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: 0.2s;
    }
    .icon-btn:hover { border-color: var(--primary); }

    .btn-auth {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-auth:hover { background: var(--primary-hover); }
    .btn-auth.logged-in { background: transparent; color: var(--text); border-color: var(--border); }

    /* AdSense Slot */
    .ad-banner {
      margin: 24px 0;
      padding: 16px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 10px;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Hero Editorial Grid */
    .hero-grid {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 28px;
      margin: 28px 0 40px;
    }
    .hero-side-stack { display: flex; flex-direction: column; gap: 20px; }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .card-img-wrap { overflow: hidden; background: var(--surface); }
    .card img { width: 100%; height: 220px; object-fit: cover; transition: transform 0.4s ease; display: block; }
    .card:hover img { transform: scale(1.03); }
    .hero-main img { height: 380px; }

    .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      width: fit-content;
    }
    .hero-main h2 { font-size: 1.65rem; font-weight: 800; line-height: 1.3; margin-bottom: 10px; letter-spacing: -0.02em; }
    .card h3 { font-size: 1.15rem; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
    .excerpt { color: var(--text-secondary); font-size: 0.92rem; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { font-size: 0.8rem; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }

    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 36px 0 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    .section-heading { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }

    /* Articles Grid */
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 26px;
      margin-bottom: 60px;
    }

    /* Full Article Reading View */
    .article-detail { max-width: 780px; margin: 32px auto 70px; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      margin-bottom: 24px;
    }
    .back-btn:hover { border-color: var(--primary); color: var(--primary); }
    .article-detail h1 { font-size: 2.3rem; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; margin: 12px 0 16px; }
    .article-hero-img { width: 100%; max-height: 460px; object-fit: cover; border-radius: 14px; margin: 22px 0; }
    .article-body {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 1.08rem;
      line-height: 1.9;
      color: var(--text);
    }
    .article-body h2, .article-body h3 { font-family: 'Inter', sans-serif; margin: 28px 0 12px; font-weight: 700; }
    .article-body p { margin-bottom: 18px; }
    .article-body ul { margin: 0 0 18px 24px; }
    .article-body li { margin-bottom: 8px; }

    .admin-delete-btn {
      margin-top: 24px;
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Floating '+' Button */
    .fab {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      font-size: 2rem;
      font-weight: 400;
      border: none;
      box-shadow: 0 10px 25px rgba(29, 78, 216, 0.45);
      cursor: pointer;
      z-index: 250;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }
    .fab:hover { transform: scale(1.08); background: var(--primary-hover); }

    /* Modals */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.72);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 20px;
    }
    .modal-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 16px;
      padding: 28px;
      max-height: 92vh;
      overflow-y: auto;
      border: 1px solid var(--border);
